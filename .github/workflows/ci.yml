name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/McpServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/McpServer/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  csharp:
    name: C# build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/RevitAddin.Tests/RevitMCPAddin.Tests.csproj
      - name: Build (no Revit deploy)
        run: dotnet build src/RevitAddin.Tests/RevitMCPAddin.Tests.csproj --no-restore -p:DeployToRevit=false
      - name: Test
        run: dotnet test src/RevitAddin.Tests/RevitMCPAddin.Tests.csproj --no-build -p:DeployToRevit=false --logger "console;verbosity=normal"

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-version.mjs

  release:
    name: Build release artifacts
    needs: [typescript, csharp, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/McpServer/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: npm ci + build
        working-directory: src/McpServer
        run: |
          npm ci
          npm run build

      - name: Build R2026 artifacts
        run: |
          dotnet build src/RevitAddin/RevitMCPAddin.csproj `
            -p:RevitVersion=2026 `
            -p:DeployToRevit=false `
            -p:OutputPath="${{ github.workspace }}/release/.build-R2026" `
            -c Release

      - name: Build R2027 artifacts
        run: |
          dotnet build src/RevitAddin/RevitMCPAddin.csproj `
            -p:RevitVersion=2027 `
            -p:DeployToRevit=false `
            -p:OutputPath="${{ github.workspace }}/release/.build-R2027" `
            -c Release

      - name: Package R2026 zip
        shell: pwsh
        run: |
          $version = (Get-Content src/McpServer/package.json | ConvertFrom-Json).version
          $pkg = "release/RevitMCPServer-v$version-R2026"
          New-Item -ItemType Directory -Force "$pkg/mcp-server/dist" | Out-Null
          Copy-Item "release/.build-R2026/RevitMCPAddin.dll"   "$pkg/"
          Copy-Item "src/RevitAddin/RevitMCPAddin.addin"       "$pkg/"
          Copy-Item "src/McpServer/dist/index.js"              "$pkg/mcp-server/dist/"
          Copy-Item "src/McpServer/package.json"               "$pkg/mcp-server/"
          Copy-Item "src/McpServer/package-lock.json"          "$pkg/mcp-server/"
          Copy-Item "scripts/install.ps1"                      "$pkg/"
          Copy-Item "scripts/uninstall.ps1"                    "$pkg/"
          Compress-Archive -Path "$pkg/*" -DestinationPath "release/RevitMCPServer-v$version-R2026.zip"
          $hash = (Get-FileHash "release/RevitMCPServer-v$version-R2026.zip" -Algorithm SHA256).Hash
          "$hash  RevitMCPServer-v$version-R2026.zip" | Out-File "release/RevitMCPServer-v$version-R2026.zip.sha256" -Encoding ascii

      - name: Package R2027 zip
        shell: pwsh
        run: |
          $version = (Get-Content src/McpServer/package.json | ConvertFrom-Json).version
          $pkg = "release/RevitMCPServer-v$version-R2027"
          New-Item -ItemType Directory -Force "$pkg/mcp-server/dist" | Out-Null
          Copy-Item "release/.build-R2027/RevitMCPAddin.dll"   "$pkg/"
          Copy-Item "src/RevitAddin/RevitMCPAddin.addin"       "$pkg/"
          Copy-Item "src/McpServer/dist/index.js"              "$pkg/mcp-server/dist/"
          Copy-Item "src/McpServer/package.json"               "$pkg/mcp-server/"
          Copy-Item "src/McpServer/package-lock.json"          "$pkg/mcp-server/"
          Copy-Item "scripts/install.ps1"                      "$pkg/"
          Copy-Item "scripts/uninstall.ps1"                    "$pkg/"
          Compress-Archive -Path "$pkg/*" -DestinationPath "release/RevitMCPServer-v$version-R2027.zip"
          $hash = (Get-FileHash "release/RevitMCPServer-v$version-R2027.zip" -Algorithm SHA256).Hash
          "$hash  RevitMCPServer-v$version-R2027.zip" | Out-File "release/RevitMCPServer-v$version-R2027.zip.sha256" -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.sha256
          generate_release_notes: true
