name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/McpServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/McpServer/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  csharp:
    name: C# build & test (R${{ matrix.revit }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - revit: 2025
            dotnet: '8.0.x'
          - revit: 2026
            dotnet: '8.0.x'
          - revit: 2027
            dotnet: '10.0.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Restore
        run: dotnet restore src/RevitAddin.Tests/RevitMCPAddin.Tests.csproj -p:RevitVersion=${{ matrix.revit }}
      - name: Build (no Revit deploy)
        run: dotnet build src/RevitAddin.Tests/RevitMCPAddin.Tests.csproj --no-restore -p:RevitVersion=${{ matrix.revit }} -p:DeployToRevit=false
      - name: Test
        run: dotnet test src/RevitAddin.Tests/RevitMCPAddin.Tests.csproj --no-build -p:RevitVersion=${{ matrix.revit }} -p:DeployToRevit=false --logger "console;verbosity=normal"

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-version.mjs

  release:
    name: Build release artifacts
    needs: [typescript, csharp, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/McpServer/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # scripts/build-release.ps1 is the SINGLE source of truth for packaging.
      # It runs the version gate, npm ci + tests, the per-Revit-version C#
      # builds, and — the part that matters here — the artifact completeness
      # gate: every runtime dependency must be present and every relative
      # import in the emitted JS must resolve inside the bundle, or the build
      # fails instead of publishing.
      #
      # This job used to hand-maintain its own copy list. It drifted: the list
      # was never updated after the 0.8.15 packaging fix, so the tagged
      # releases it produced shipped without RevitMCP.Core.dll (the whole
      # command kernel), without dist/revitClient.js and dist/recipes.js (which
      # index.js imports, so the server died on startup), and without the
      # WebView2 assemblies the AutoAudit panel needs. Never duplicate the list
      # again — extend the script.
      - name: Build release bundle
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.sha256
          generate_release_notes: true
